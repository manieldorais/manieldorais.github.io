<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#171717">
    <title>Cérebro AI | Neural Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0e0e0e;
            --bg-sidebar: #171717;
            --bg-chat: #0e0e0e;
            --bg-input: #1e1e1e;
            --bg-msg-user: #2a2a2a;
            --bg-msg-ia: transparent;
            --text-primary: #e3e3e3;
            --text-secondary: #9ca3af;
            --accent-color: #7c3aed;
            --accent-glow: #7c3aed40;
            --border-color: #333;
            --radius-lg: 16px;
            --radius-md: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            /* Usa dvh para descontar as barras do navegador mobile */
            height: 100dvh; 
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top)); /* Notch support */
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
        }

        .history-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
        }
        .history-item.active { background-color: #2a2a2a; color: var(--text-primary); font-weight: 500; }
        
        .delete-chat {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #ef4444; display: none; padding: 5px;
        }
        .history-item.active .delete-chat { display: block; }

        /* Overlay para mobile quando menu abre */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 15;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }

        /* --- MAIN CHAT --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100dvh; /* Garante altura total */
        }

        .mobile-header {
            display: none;
            padding: 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            background: var(--bg-sidebar);
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5%;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .message-wrapper { display: flex; gap: 12px; animation: slideUp 0.3s ease; }
        
        .avatar {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: bold;
        }
        .avatar.user { background-color: #333; }
        .avatar.ia { background: linear-gradient(135deg, #7c3aed, #2563eb); }

        .message-content {
            line-height: 1.5; font-size: 1rem; max-width: 100%; word-break: break-word;
        }
        .message-content.user {
            background-color: var(--bg-msg-user); padding: 10px 16px;
            border-radius: 18px 18px 4px 18px; max-width: 85%;
        }
        .message-content strong { color: #fff; font-weight: 600; }
        .message-content code { background: #333; padding: 2px 4px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }

        /* --- INPUT AREA --- */
        .input-container {
            padding: 15px;
            /* Proteção para área de gestos do iPhone */
            padding-bottom: max(15px, env(safe-area-inset-bottom)); 
            background: var(--bg-body);
            border-top: 1px solid #1f1f1f;
        }

        .input-box {
            background-color: var(--bg-input);
            border-radius: 24px;
            padding: 8px 15px;
            display: flex;
            align-items: flex-end;
            border: 1px solid var(--border-color);
        }

        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-primary);
            resize: none; max-height: 120px; padding: 10px 5px;
            font-family: inherit; 
            font-size: 16px; /* Importante: 16px evita zoom no iOS */
        }

        #send-btn {
            background: var(--text-primary); color: var(--bg-body); border: none;
            width: 34px; height: 34px; border-radius: 50%; margin-left: 8px; margin-bottom: 4px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        #send-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* --- EXTRAS --- */
        .thinking-indicator { display: none; gap: 4px; padding: 10px 0 10px 42px; }
        .dot { width: 6px; height: 6px; background: var(--accent-color); border-radius: 50%; animation: pulse 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            aside { 
                position: absolute; height: 100dvh; left: 0; top: 0;
                transform: translateX(-100%); width: 85%; max-width: 300px;
                box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            }
            aside.open { transform: translateX(0); }
            aside.open + .sidebar-overlay { opacity: 1; pointer-events: all; }
            
            .mobile-header { display: flex; }
            #chat-container { padding: 15px; }
            
            /* Ajuste fino para não cobrir a última mensagem */
            .input-container { position: relative; z-index: 5; }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"></div>
            <span>Cérebro</span>
        </div>
        <button class="new-chat-btn" onclick="startNewSession()">+ Nova Conversa</button>
        <div class="history-list" id="history-list"></div>
    </aside>
    
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main>
        <div class="mobile-header">
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; padding: 5px;">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <span style="font-weight:600;">Cérebro AI</span>
            <div style="width:24px; height:24px; border-radius:50%; background:#ef4444;" id="conn-status"></div>
        </div>

        <div id="chat-container"></div>

        <div class="thinking-indicator" id="thinking-indicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="message-input" placeholder="Mensagem..." rows="1" oninput="autoResize(this)"></textarea>
                <button id="send-btn">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // CONFIG
        const WEBSOCKET_URL = 'wss://depot-tiny-entering-called.trycloudflare.com/';
        
        // STATE
        let socket;
        let currentSessionId = null;
        let sessions = JSON.parse(localStorage.getItem('cerebro_sessions') || '{}');
        let currentAIMessageDiv = null;
        let fullResponseBuffer = "";

        // DOM
        const chatContainer = document.getElementById('chat-container');
        const historyList = document.getElementById('history-list');
        const msgInput = document.getElementById('message-input');
        const thinkingIndicator = document.getElementById('thinking-indicator');
        const statusDot = document.getElementById('conn-status');

        function initSessions() {
            const keys = Object.keys(sessions);
            if (keys.length > 0) loadSession(keys[keys.length - 1]);
            else startNewSession();
            renderHistoryList();
        }

        function startNewSession() {
            currentSessionId = 'sess_' + Date.now();
            sessions[currentSessionId] = { title: 'Nova Conversa', messages: [] };
            saveSessions();
            renderHistoryList();
            renderChat();
            closeSidebarMobile();
        }

        function loadSession(id) {
            currentSessionId = id;
            renderChat();
            renderHistoryList();
            closeSidebarMobile();
        }

        function deleteSession(e, id) {
            e.stopPropagation();
            if(confirm('Apagar conversa?')) {
                delete sessions[id];
                saveSessions();
                if (currentSessionId === id) startNewSession();
                else renderHistoryList();
            }
        }

        function saveSessions() { localStorage.setItem('cerebro_sessions', JSON.stringify(sessions)); }

        function renderHistoryList() {
            historyList.innerHTML = '';
            Object.keys(sessions).reverse().forEach(id => {
                const div = document.createElement('div');
                div.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
                div.innerHTML = `${sessions[id].title} <button class="delete-chat" onclick="deleteSession(event, '${id}')">×</button>`;
                div.onclick = () => loadSession(id);
                historyList.appendChild(div);
            });
        }

        function renderChat() {
            chatContainer.innerHTML = '';
            (sessions[currentSessionId]?.messages || []).forEach(msg => createMessageBubble(msg.text, msg.sender));
            scrollToBottom();
        }

        function createMessageBubble(text, sender) {
            if (sender === 'ia' && currentAIMessageDiv) {
                currentAIMessageDiv.innerHTML = formatMarkdown(text);
                scrollToBottom();
                return;
            }
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = `
                <div class="avatar ${sender}">${sender === 'user' ? 'VC' : 'IA'}</div>
                <div class="message-content ${sender}">${sender === 'ia' ? formatMarkdown(text) : text}</div>
            `;
            if (sender === 'ia') currentAIMessageDiv = wrapper.querySelector('.message-content');
            else currentAIMessageDiv = null;
            
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function formatMarkdown(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        }

        function scrollToBottom() {
            // Pequeno delay ajuda no mobile quando o teclado está abrindo
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }

        function connect() {
            socket = new WebSocket(WEBSOCKET_URL);
            socket.onopen = () => statusDot.style.background = '#00e676';
            socket.onmessage = (e) => {
                thinkingIndicator.style.display = 'none';
                const data = JSON.parse(e.data);
                if (data.type === 'ia' || data.type === 'ia_stream') {
                    if (data.type === 'ia') fullResponseBuffer = data.message;
                    else fullResponseBuffer += data.message;
                    
                    createMessageBubble(fullResponseBuffer, 'ia');
                    // Salva apenas de tempos em tempos ou no final para performance, 
                    // aqui simplificado salvando sempre:
                    let msgs = sessions[currentSessionId].messages;
                    if(msgs.length > 0 && msgs[msgs.length-1].sender === 'ia') msgs[msgs.length-1].text = fullResponseBuffer;
                    else msgs.push({ text: fullResponseBuffer, sender: 'ia' });
                    saveSessions();
                }
            };
            socket.onclose = () => { statusDot.style.background = '#ef4444'; setTimeout(connect, 3000); };
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            
            createMessageBubble(text, 'user');
            msgInput.value = ''; autoResize(msgInput);
            thinkingIndicator.style.display = 'flex';
            scrollToBottom();

            sessions[currentSessionId].messages.push({ text, sender: 'user' });
            if(sessions[currentSessionId].messages.length === 1) sessions[currentSessionId].title = text.substring(0,25) + '...';
            saveSessions();
            renderHistoryList();

            fullResponseBuffer = "";
            currentAIMessageDiv = null;
            socket.send(text);
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function closeSidebarMobile() { document.getElementById('sidebar').classList.remove('open'); }

        document.getElementById('send-btn').onclick = sendMessage;
        msgInput.onkeypress = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }};

        window.onload = () => { initSessions(); connect(); };
    </script>
</body>
</html>
