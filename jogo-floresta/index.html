<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>O Jardim da Ana</title>
	<style>
		body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: 'Segoe UI', sans-serif; }
		
		#ui {
			position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
			color: #4a2e1b; text-align: center; background: rgba(255, 255, 255, 0.9);
			padding: 40px; border-radius: 25px; border: 4px solid #ffb6c1;
			cursor: pointer; z-index: 10; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
			width: 85%; max-width: 350px; backdrop-filter: blur(10px);
		}

		h1 { margin: 0 0 10px 0; color: #ff69b4; font-size: 2rem; }
		p { margin: 5px 0; font-size: 1.1rem; }

		#joystick-zone {
			display: none; position: absolute; bottom: 40px; left: 40px;
			width: 130px; height: 130px; background: rgba(255, 255, 255, 0.3);
			border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); z-index: 5;
			backdrop-filter: blur(5px);
		}
		#joystick-knob {
			position: absolute; top: 40px; left: 40px;
			width: 50px; height: 50px; background: #ff69b4;
			border-radius: 50%; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5);
		}

		#win-screen {
			display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			background: radial-gradient(circle at center, rgba(255,182,193,0.95) 0%, rgba(135,206,235,0.95) 100%);
			color: #fff; flex-direction: column; justify-content: center; align-items: center;
			z-index: 100; text-align: center; backdrop-filter: blur(10px);
		}

		.btn { margin-top: 30px; padding: 15px 40px; background: #fff; color: #ff69b4; border: none; border-radius: 30px; font-weight: bold; font-size: 1.2rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
	</style>
</head>
<body>

	<div id="ui">
		<h1>🌸 O Jardim de Ana</h1>
		<p>Um lugar criado só para você.</p>
		<p><strong>Toque para explorar</strong></p>
	</div>

	<div id="joystick-zone"><div id="joystick-knob"></div></div>

	<div id="win-screen">
		<h1 style="font-size: 3.5rem; text-shadow: 0 0 20px #ff69b4; margin-bottom: 0;">ANA, EU TE AMO! ❤️</h1>
		<p style="font-size: 1.5rem; text-shadow: 0 2px 5px rgba(0,0,0,0.2);">Você encontrou o que sinto por você.</p>
		<button class="btn" onclick="location.reload()">Recomeçar</button>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
				"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
		import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
		import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
		import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

		const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x87ceeb);
		scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

		const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
		
		const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
		renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : window.devicePixelRatio);
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.body.appendChild(renderer.domElement);

		const renderScene = new RenderPass(scene, camera);
		const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
		bloomPass.threshold = 0.9;
		bloomPass.strength = 0.6;
		bloomPass.radius = 0.5;

		const composer = new EffectComposer(renderer);
		composer.addPass(renderScene);
		composer.addPass(bloomPass);

		scene.add(new THREE.AmbientLight(0xffffff, 0.7)); 
		const sun = new THREE.DirectionalLight(0xfff0f5, 1.0);
		sun.position.set(50, 100, 20);
		scene.add(sun);

		const floor = new THREE.Mesh(
			new THREE.PlaneGeometry(400, 400), 
			new THREE.MeshLambertMaterial({ color: 0x7cfc00 })
		);
		floor.rotation.x = -Math.PI / 2;
		scene.add(floor);

		const treeCount = isMobile ? 300 : 500;
		const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 5, 5);
		const leavesGeo = new THREE.IcosahedronGeometry(3, 0);
		
		const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshLambertMaterial({ color: 0x8b4513 }), treeCount);
		const leaves = new THREE.InstancedMesh(leavesGeo, new THREE.MeshLambertMaterial({ color: 0x32cd32 }), treeCount);

		const dummy = new THREE.Object3D();
		for (let i = 0; i < treeCount; i++) {
			const x = (Math.random() - 0.5) * 250;
			const z = (Math.random() - 0.5) * 250;
			if (Math.abs(x) < 10 || (x*x + z*z) < 50) continue;
			
			const scale = 0.7 + Math.random() * 0.8;
			
			// Tronco: Resetando a rotação para nascer reto
			dummy.position.set(x, 2.5 * scale, z);
			dummy.rotation.set(0, 0, 0); 
			dummy.scale.set(scale, scale, scale);
			dummy.updateMatrix();
			trunks.setMatrixAt(i, dummy.matrix);

			// Folhas: Mantendo a rotação orgânica
			dummy.position.set(x, 6 * scale, z);
			dummy.rotation.set(Math.random(), Math.random(), 0);
			dummy.updateMatrix();
			leaves.setMatrixAt(i, dummy.matrix);
		}
		scene.add(trunks, leaves);

		const partCount = isMobile ? 200 : 500;
		const partGeo = new THREE.BufferGeometry();
		const partPos = new Float32Array(partCount * 3);
		const partPhases = new Float32Array(partCount);

		for(let i=0; i < partCount; i++) {
			partPos[i*3] = (Math.random() - 0.5) * 100;
			partPos[i*3+1] = Math.random() * 10;
			partPos[i*3+2] = (Math.random() - 0.5) * 100;
			partPhases[i] = Math.random() * Math.PI * 2;
		}
		partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
		partGeo.setAttribute('phase', new THREE.BufferAttribute(partPhases, 1));

		const partMat = new THREE.PointsMaterial({ color: new THREE.Color(2, 2, 2), size: 0.3 });
		const particles = new THREE.Points(partGeo, partMat);
		scene.add(particles);

		const targetPos = { x: 0, z: -80 };
		const canvas = document.createElement('canvas');
		const ctx = canvas.getContext('2d');
		canvas.width = 1024; canvas.height = 256;
		
		ctx.fillStyle = '#ffffff'; 
		ctx.font = 'bold 90px sans-serif'; 
		ctx.textAlign = 'center';
		ctx.fillText('✨ ANA, EU TE AMO! ✨', 512, 128);

		const textTex = new THREE.CanvasTexture(canvas);
		const spriteMat = new THREE.SpriteMaterial({ map: textTex, color: new THREE.Color(1.5, 0.5, 1.0) }); 
		const sprite = new THREE.Sprite(spriteMat);
		sprite.scale.set(15, 3.5, 1);
		sprite.position.set(targetPos.x, 3, targetPos.z);
		scene.add(sprite);

		const controls = new PointerLockControls(camera, document.body);
		const ui = document.getElementById('ui');
		const joyZone = document.getElementById('joystick-zone');
		const knob = document.getElementById('joystick-knob');

		ui.addEventListener('click', () => {
			if (!isMobile) controls.lock();
			ui.style.display = 'none';
			if (isMobile) joyZone.style.display = 'block';
		});

		let keys = { w: false, s: false, a: false, d: false };
		document.addEventListener('keydown', e => { if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = true; });
		document.addEventListener('keyup', e => { if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = false; });

		let joyTouchId = null, lookTouchId = null;
		let joyX = 0, joyY = 0;
		let lastLookX = 0, lastLookY = 0;
		const maxJoyDist = 45;

		document.addEventListener('touchstart', e => {
			for (let i = 0; i < e.changedTouches.length; i++) {
				const touch = e.changedTouches[i];
				const rect = joyZone.getBoundingClientRect();
				if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
					joyTouchId = touch.identifier;
				} else if (touch.clientX > window.innerWidth / 2) {
					lookTouchId = touch.identifier;
					lastLookX = touch.clientX; lastLookY = touch.clientY;
				}
			}
		}, { passive: false });

		document.addEventListener('touchmove', e => {
			for (let i = 0; i < e.changedTouches.length; i++) {
				const touch = e.changedTouches[i];
				if (touch.identifier === joyTouchId) {
					e.preventDefault();
					const rect = joyZone.getBoundingClientRect();
					let dx = touch.clientX - (rect.left + rect.width / 2);
					let dy = touch.clientY - (rect.top + rect.height / 2);
					const dist = Math.min(maxJoyDist, Math.sqrt(dx*dx + dy*dy));
					const angle = Math.atan2(dy, dx);
					const kX = Math.cos(angle) * dist; const kY = Math.sin(angle) * dist;
					knob.style.transform = `translate(${kX}px, ${kY}px)`;
					joyX = kX / maxJoyDist; joyY = kY / maxJoyDist;
				} else if (touch.identifier === lookTouchId) {
					e.preventDefault();
					camera.rotation.y -= (touch.clientX - lastLookX) * 0.004;
					camera.rotation.x -= (touch.clientY - lastLookY) * 0.004;
					camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
					lastLookX = touch.clientX; lastLookY = touch.clientY;
				}
			}
		}, { passive: false });

		document.addEventListener('touchend', e => {
			for (let i = 0; i < e.changedTouches.length; i++) {
				if (e.changedTouches[i].identifier === joyTouchId) {
					joyTouchId = null; joyX = 0; joyY = 0; knob.style.transform = `translate(0, 0)`;
				}
				if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
			}
		});

		const clock = new THREE.Clock();
		camera.position.set(0, 1.8, 5);
		camera.rotation.order = 'YXZ';

		function animate() {
			requestAnimationFrame(animate);
			const delta = clock.getDelta();
			const time = clock.getElapsedTime();
			const speed = 20 * delta;

			if (controls.isLocked) {
				if (keys.w) controls.moveForward(speed);
				if (keys.s) controls.moveForward(-speed);
				if (keys.a) controls.moveRight(-speed);
				if (keys.d) controls.moveRight(speed);
			} else if (isMobile) {
				if (joyY !== 0) camera.translateZ(joyY * speed);
				if (joyX !== 0) camera.translateX(joyX * speed);
			}
			camera.position.y = 1.8;

			const posAttr = particles.geometry.attributes.position;
			const phaseAttr = particles.geometry.attributes.phase;
			for(let i=0; i<partCount; i++) {
				posAttr.array[i*3+1] += Math.sin(time * 2 + phaseAttr.array[i]) * 0.02;
			}
			posAttr.needsUpdate = true;
			particles.rotation.y = time * 0.05;

			sprite.position.y = 3.5 + Math.sin(time * 2) * 0.3;

			if (camera.position.distanceTo(new THREE.Vector3(targetPos.x, 1.8, targetPos.z)) < 6) {
				document.getElementById('win-screen').style.display = 'flex';
				joyZone.style.display = 'none';
				if (!isMobile) controls.unlock();
			}

			composer.render();
		}
		animate();

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			composer.setSize(window.innerWidth, window.innerHeight);
		});
	</script>
</body>
</html>
