<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Tracker">
	<title>Monitor Avançado</title>
	
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	
	<style>
		:root {
			--bg: #000000;
			--text: #ffffff;
			--primary: #ff453a;
			--card: #1c1c1e;
			--gray: #8e8e93;
		}
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		body {
			background-color: var(--bg);
			color: var(--text);
			padding: 20px;
			padding-top: env(safe-area-inset-top);
			padding-bottom: 50px;
		}
		.card {
			background: var(--card);
			border-radius: 15px;
			padding: 20px;
			margin-bottom: 15px;
			width: 100%;
		}
		.grid-2 {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 15px;
		}
		h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
		h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--gray); border-bottom: 1px solid #333; padding-bottom: 5px; }
		
		/* Estatísticas */
		.stat-val { font-size: 2rem; color: var(--primary); font-weight: bold; }
		.stat-label { color: var(--gray); font-size: 0.8rem; }
		
		/* Botões */
		.btn-main {
			background: var(--primary);
			color: white;
			border: none;
			border-radius: 50%;
			width: 120px;
			height: 120px;
			font-size: 1.2rem;
			font-weight: bold;
			margin: 20px auto;
			display: block;
			cursor: pointer;
			box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
		}
		.btn-main:active { transform: scale(0.95); }
		.btn-small {
			background: #3a3a3c;
			color: white;
			border: none;
			padding: 10px 15px;
			border-radius: 8px;
			cursor: pointer;
			width: 100%;
			margin-top: 10px;
		}
		.btn-danger { background: #ff453a; color: white; border: none; padding: 5px 10px; border-radius: 5px; }
		
		/* Inputs */
		input {
			width: 100%;
			padding: 12px;
			background: #2c2c2e;
			border: 1px solid #3a3a3c;
			color: white;
			border-radius: 8px;
			color-scheme: dark;
			margin-bottom: 10px;
		}
		
		/* Histórico */
		.history-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px 0;
			border-bottom: 1px solid #333;
		}
		canvas { width: 100% !important; height: 200px !important; }
	</style>
</head>
<body>

	<h1>Progresso</h1>

	<div class="card grid-2">
		<div>
			<div class="stat-val" id="todayCount">0</div>
			<div class="stat-label">Hoje</div>
		</div>
		<div>
			<div class="stat-val" id="timeSince" style="font-size: 1.2rem; margin-top:10px;">--:--</div>
			<div class="stat-label">Desde o último</div>
		</div>
		<div>
			<div class="stat-val" id="recordTime" style="font-size: 1.2rem; margin-top:10px;">--:--</div>
			<div class="stat-label">Recorde</div>
		</div>
		<div>
			<div class="stat-val" id="totalSpent" style="font-size: 1.2rem; margin-top:10px;">R$ 0,00</div>
			<div class="stat-label">Gasto Total</div>
		</div>
	</div>

	<button class="btn-main" onclick="addLog(Date.now())">AGORA</button>

	<div class="card">
		<h3>Adicionar Esquecido</h3>
		<input type="datetime-local" id="manualDate">
		<button class="btn-small" onclick="addManualLog()">Registrar Data Específica</button>
	</div>

	<div class="card">
		<canvas id="weeklyChart"></canvas>
	</div>

	<div class="card">
		<h3>Histórico Recente</h3>
		<div id="historyList"></div>
	</div>

	<div class="card">
		<h3>Configurações e Backup</h3>
		<label class="stat-label">Custo por unidade (R$):</label>
		<input type="number" id="unitCost" step="0.01" onchange="saveSettings()" placeholder="Ex: 1.50">
		<button class="btn-small" onclick="exportData()">Exportar Backup</button>
		<input type="file" id="importFile" style="display:none" onchange="importData(event)">
		<button class="btn-small" onclick="document.getElementById('importFile').click()">Importar Backup</button>
	</div>

	<script>
		let logs = JSON.parse(localStorage.getItem('smokeLogs')) || [];
		let settings = JSON.parse(localStorage.getItem('smokeSettings')) || { unitCost: 0 };
		let chartInstance = null;

		document.getElementById('unitCost').value = settings.unitCost;

		function saveSettings() {
			settings.unitCost = parseFloat(document.getElementById('unitCost').value) || 0;
			localStorage.setItem('smokeSettings', JSON.stringify(settings));
			updateUI();
		}

		function addLog(timestamp) {
			logs.push(timestamp);
			logs.sort((a, b) => a - b); // Mantém ordem cronológica
			saveLogs();
			if (navigator.vibrate) navigator.vibrate(50);
		}

		function addManualLog() {
			const manualVal = document.getElementById('manualDate').value;
			if (!manualVal) return alert('Selecione uma data e hora.');
			const timestamp = new Date(manualVal).getTime();
			if (timestamp > Date.now()) return alert('Não é possível registrar no futuro.');
			addLog(timestamp);
			document.getElementById('manualDate').value = '';
		}

		function deleteLog(index) {
			if (confirm('Deletar este registro?')) {
				logs.splice(index, 1);
				saveLogs();
			}
		}

		function saveLogs() {
			localStorage.setItem('smokeLogs', JSON.stringify(logs));
			updateUI();
		}

		function formatDuration(ms) {
			if (ms < 0) return "--:--";
			const hrs = Math.floor(ms / 3600000);
			const mins = Math.floor((ms % 3600000) / 60000);
			return `${hrs}h ${mins}m`;
		}

		function updateUI() {
			const now = Date.now();
			const today = new Date().setHours(0,0,0,0);
			
			// Hoje
			document.getElementById('todayCount').innerText = logs.filter(t => t >= today).length;

			// Último e Recorde
			let maxDiff = 0;
			if (logs.length > 0) {
				document.getElementById('timeSince').innerText = formatDuration(now - logs[logs.length - 1]);
				
				for (let i = 1; i < logs.length; i++) {
					const diff = logs[i] - logs[i-1];
					if (diff > maxDiff) maxDiff = diff;
				}
				const currentStreak = now - logs[logs.length - 1];
				if (currentStreak > maxDiff) maxDiff = currentStreak;
				
				document.getElementById('recordTime').innerText = formatDuration(maxDiff);
			} else {
				document.getElementById('timeSince').innerText = "--:--";
				document.getElementById('recordTime').innerText = "--:--";
			}

			// Financeiro
			const totalSpent = logs.length * settings.unitCost;
			document.getElementById('totalSpent').innerText = `R$ ${totalSpent.toFixed(2).replace('.', ',')}`;

			renderHistory();
			renderChart();
		}

		function renderHistory() {
			const container = document.getElementById('historyList');
			container.innerHTML = '';
			// Pega os últimos 5
			const recentLogs = logs.slice().reverse().slice(0, 5);
			
			recentLogs.forEach((timestamp, i) => {
				const realIndex = logs.length - 1 - i;
				const d = new Date(timestamp);
				const dateStr = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
				
				container.innerHTML += `
					<div class="history-item">
						<span>${dateStr}</span>
						<button class="btn-danger" onclick="deleteLog(${realIndex})">X</button>
					</div>
				`;
			});
			if (recentLogs.length === 0) container.innerHTML = '<p class="stat-label">Nenhum registro</p>';
		}

		function renderChart() {
			const ctx = document.getElementById('weeklyChart').getContext('2d');
			const labels = [];
			const data = [];
			
			for (let i = 6; i >= 0; i--) {
				const d = new Date();
				d.setDate(d.getDate() - i);
				d.setHours(0,0,0,0);
				const nextDay = new Date(d);
				nextDay.setDate(nextDay.getDate() + 1);
				
				labels.push(`${d.getDate()}/${d.getMonth()+1}`);
				data.push(logs.filter(t => t >= d.getTime() && t < nextDay.getTime()).length);
			}

			if (chartInstance) chartInstance.destroy();

			chartInstance = new Chart(ctx, {
				type: 'line',
				data: {
					labels: labels,
					datasets: [{
						label: 'Registros',
						data: data,
						borderColor: '#ff453a',
						backgroundColor: 'rgba(255, 69, 58, 0.2)',
						fill: true,
						tension: 0.4
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					plugins: { legend: { display: false } },
					scales: {
						y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8e8e93' }, grid: { color: '#3a3a3c' } },
						x: { ticks: { color: '#8e8e93' }, grid: { display: false } }
					}
				}
			});
		}

		function exportData() {
			const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({logs, settings}));
			const dlAnchorElem = document.createElement('a');
			dlAnchorElem.setAttribute("href", dataStr);
			dlAnchorElem.setAttribute("download", "backup_tracker.json");
			dlAnchorElem.click();
		}

		function importData(event) {
			const file = event.target.files[0];
			if (!file) return;
			const reader = new FileReader();
			reader.onload = function(e) {
				try {
					const data = JSON.parse(e.target.result);
					if (data.logs) {
						logs = data.logs;
						settings = data.settings || { unitCost: 0 };
						document.getElementById('unitCost').value = settings.unitCost;
						saveLogs();
						saveSettings();
						alert('Dados importados com sucesso!');
					}
				} catch (err) {
					alert('Erro ao ler arquivo de backup.');
				}
			};
			reader.readAsText(file);
		}

		setInterval(updateUI, 60000);
		updateUI();
	</script>
</body>
</html>
