<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mundo Secreto - Para Ana</title>
	<style>
		body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0a1a0a; }
		
		#ui {
			position: absolute;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			color: white;
			text-align: center;
			background: rgba(0, 0, 0, 0.7);
			padding: 20px;
			border-radius: 15px;
			border: 2px solid #ff69b4;
			cursor: pointer;
			transition: opacity 0.5s;
		}

		#win-screen {
			display: none;
			position: fixed;
			top: 0; left: 0; width: 100%; height: 100%;
			background: radial-gradient(circle, #200020 0%, #000000 100%);
			color: #ff69b4;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 100;
			text-align: center;
		}

		h1 { margin: 0; font-size: 2.5rem; }
		p { color: #ddd; }
	</style>
</head>
<body>

	<div id="ui">
		<h1>O Bosque Secreto</h1>
		<p>Clique para entrar no mundo</p>
		<small>(Use WASD para andar e Mouse para olhar)</small>
	</div>

	<div id="win-screen">
		<h1 style="font-size: 5rem; text-shadow: 0 0 20px #ff69b4;">ANA, EU TE AMO!</h1>
		<p style="font-size: 1.5rem; color: white;">Você encontrou o que estava escondido no meu coração.</p>
		<button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">Jogar Novamente</button>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
				"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

		// --- CONFIGURAÇÃO DA CENA ---
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x050a05); 
		scene.fog = new THREE.Fog(0x050a05, 1, 45);

		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setPixelRatio(window.devicePixelRatio);
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.body.appendChild(renderer.domElement);

		// --- ILUMINAÇÃO ---
		const ambientLight = new THREE.AmbientLight(0x404040, 0.5); 
		scene.add(ambientLight);

		const moonLight = new THREE.DirectionalLight(0x5555ff, 0.8);
		moonLight.position.set(10, 20, 10);
		scene.add(moonLight);

		// --- CHÃO ---
		const floorGeo = new THREE.PlaneGeometry(1000, 1000);
		const floorMat = new THREE.MeshPhongMaterial({ color: 0x050f05 });
		const floor = new THREE.Mesh(floorGeo, floorMat);
		floor.rotation.x = -Math.PI / 2;
		scene.add(floor);

		// --- FLORESTA (Instanced Mesh para performance) ---
		const treeCount = 1500;
		const trunkGeo = new THREE.CylinderGeometry(0.1, 0.2, 2);
		const trunkMat = new THREE.MeshPhongMaterial({ color: 0x2d1b00 });
		const leavesGeo = new THREE.ConeGeometry(1, 3, 5);
		const leavesMat = new THREE.MeshPhongMaterial({ color: 0x0a2a0a });

		const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
		const leaves = new THREE.InstancedMesh(leavesGeo, leavesMat, treeCount);

		const dummy = new THREE.Object3D();
		for (let i = 0; i < treeCount; i++) {
			const x = (Math.random() - 0.5) * 300;
			const z = (Math.random() - 0.5) * 300;
			
			// Deixa o centro e o caminho livres
			if (Math.sqrt(x*x + z*z) < 15) continue;

			dummy.position.set(x, 1, z);
			dummy.updateMatrix();
			trunks.setMatrixAt(i, dummy.matrix);

			dummy.position.set(x, 3, z);
			dummy.updateMatrix();
			leaves.setMatrixAt(i, dummy.matrix);
		}
		scene.add(trunks, leaves);

		// --- O ALVO: ANA EU TE AMO ---
		const targetPos = { x: 0, y: 2, z: -60 };

		// Brilho (Vagalumes)
		const particleCount = 100;
		const pGeo = new THREE.BufferGeometry();
		const pPos = new Float32Array(particleCount * 3);
		for(let i=0; i<particleCount*3; i++) pPos[i] = (Math.random()-0.5) * 8;
		pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
		const pMat = new THREE.PointsMaterial({ color: 0xff69b4, size: 0.15, transparent: true, opacity: 0.8 });
		const fireflies = new THREE.Points(pGeo, pMat);
		fireflies.position.set(targetPos.x, targetPos.y, targetPos.z);
		scene.add(fireflies);

		// Texto usando Canvas
		const canvas = document.createElement('canvas');
		const ctx = canvas.getContext('2d');
		canvas.width = 1024; canvas.height = 256;
		ctx.fillStyle = '#ff69b4';
		ctx.font = 'bold 100px Arial';
		ctx.textAlign = 'center';
		ctx.shadowColor = "white";
		ctx.shadowBlur = 15;
		ctx.fillText('ANA, EU TE AMO!', 512, 128);

		const textTex = new THREE.CanvasTexture(canvas);
		const spriteMat = new THREE.SpriteMaterial({ map: textTex });
		const sprite = new THREE.Sprite(spriteMat);
		sprite.scale.set(12, 3, 1);
		sprite.position.set(targetPos.x, targetPos.y + 1, targetPos.z);
		scene.add(sprite);

		// --- CONTROLES ---
		const controls = new PointerLockControls(camera, document.body);
		const ui = document.getElementById('ui');

		ui.addEventListener('click', () => {
			controls.lock();
		});

		controls.addEventListener('lock', () => ui.style.opacity = '0');
		controls.addEventListener('unlock', () => { if(document.getElementById('win-screen').style.display !== 'flex') ui.style.opacity = '1'; });

		let moveF = false, moveB = false, moveL = false, moveR = false;
		document.addEventListener('keydown', (e) => {
			if(e.code === 'KeyW') moveF = true;
			if(e.code === 'KeyS') moveB = true;
			if(e.code === 'KeyA') moveL = true;
			if(e.code === 'KeyD') moveR = true;
		});
		document.addEventListener('keyup', (e) => {
			if(e.code === 'KeyW') moveF = false;
			if(e.code === 'KeyS') moveB = false;
			if(e.code === 'KeyA') moveL = false;
			if(e.code === 'KeyD') moveR = false;
		});

		// --- LOOP DE ANIMAÇÃO ---
		const velocity = new THREE.Vector3();
		const clock = new THREE.Clock();

		function animate() {
			requestAnimationFrame(animate);
			const delta = clock.getDelta();

			if (controls.isLocked) {
				const speed = 30.0;
				velocity.set(0, 0, 0);

				if (moveF) velocity.z -= speed * delta;
				if (moveB) velocity.z += speed * delta;
				if (moveL) velocity.x -= speed * delta;
				if (moveR) velocity.x += speed * delta;

				controls.moveRight(velocity.x);
				controls.moveForward(-velocity.z);

				// Flutuação suave das partículas
				fireflies.rotation.y += 0.005;
				fireflies.position.y = targetPos.y + Math.sin(Date.now() * 0.002) * 0.5;

				// Checar vitória
				const dist = camera.position.distanceTo(new THREE.Vector3(targetPos.x, camera.position.y, targetPos.z));
				if (dist < 5) {
					document.getElementById('win-screen').style.display = 'flex';
					controls.unlock();
				}
			}
			renderer.render(scene, camera);
		}

		camera.position.set(0, 1.6, 5); // Começa um pouco atrás do centro
		animate();

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});
	</script>
</body>
</html>
