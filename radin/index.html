<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radin de Som</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
		body { font-family: 'JetBrains Mono', monospace; }
		canvas { image-rendering: pixelated; }
		/* Animação para quando recebe um char */
		@keyframes flash {
			0% { background-color: rgba(34, 197, 94, 0.2); }
			100% { background-color: transparent; }
		}
		.char-received { animation: flash 0.5s ease-out; }
	</style>
</head>
<!-- Ajuste 100% Mobile: Removemos travas de rolagem do desktop -->
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col overflow-y-auto">
	
	<!-- Topo -->
	<header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md z-10 shrink-0 sticky top-0">
		<div class="flex items-center gap-3">
			<div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>
			<h1 class="font-bold text-lg tracking-wider text-green-400">RADIN DE <span class="text-white">SOM</span></h1>
		</div>
		<div class="flex gap-4 text-xs font-bold text-gray-400 hidden sm:flex">
			<div class="flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-full"></span> 0 = LOW</div>
			<div class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full"></span> 1 = HIGH</div>
		</div>
	</header>
	
	<!-- Layout alterado para coluna única (flex-col) sempre -->
	<main class="flex-grow flex flex-col h-full max-w-lg mx-auto w-full">
		
		<!-- SEÇÃO TRANSMISSOR -->
		<section class="border-b border-gray-700 flex flex-col relative bg-gray-900/50">
			<div class="absolute top-0 left-0 w-1 h-full bg-blue-600/20"></div>
			
			<!-- Header do TX com Controles -->
			<div class="p-4 border-b border-gray-700 bg-gray-800/50 flex flex-wrap gap-2 justify-between items-center">
				<h2 class="text-blue-400 font-bold flex items-center gap-2">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
					ENVIAR
				</h2>
				
				<div class="flex gap-2">
					<select id="txFreqBase" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-blue-500">
						<option value="1000">1.0 kHz (Teste)</option>
						<option value="3000">3.0 kHz (Estável)</option>
						<option value="5000">5.0 kHz</option>
						<option value="6000">6.0 kHz</option>
						<option value="9000">9.0 kHz (Alta Fid.)</option>
						<option value="12000">12.0 kHz</option>
						<option value="15000">15.0 kHz</option>
					</select>
					
					<select id="txSpeed" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-blue-500">
						<option value="100">100ms (Lento)</option>
						<option value="60">60ms (Rápido)</option>
					</select>
				</div>
			</div>
			
			<div class="p-4 flex flex-col gap-4">
				<div>
					<label class="text-xs text-gray-400 font-bold mb-2 block uppercase">Mensagem</label>
					<textarea id="txInput" rows="2" class="w-full bg-gray-800 border-2 border-gray-700 rounded p-3 text-white focus:border-blue-500 outline-none transition resize-none text-lg placeholder-gray-600" placeholder="Digite para enviar..."></textarea>
				</div>
				
				<button id="btnSend" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-900/40 transition active:scale-95 flex justify-center items-center gap-2 touch-manipulation">
					<span>TRANSMITIR</span>
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
				</button>
				
				<!-- Status Visual TX -->
				<div class="bg-black rounded p-2 font-mono text-xs border border-gray-700 h-24 overflow-hidden relative">
					<div class="text-gray-500 border-b border-gray-800 mb-1 pb-1 flex justify-between">
						<span>TX MONITOR</span>
						<span id="txStatus" class="text-gray-400">IDLE</span>
					</div>
					<div id="txVisualizer" class="flex flex-wrap gap-1 opacity-80 pb-2"></div>
				</div>
			</div>
		</section>
		
		<!-- SEÇÃO RECEPTOR -->
		<section class="flex-grow flex flex-col relative bg-black min-h-[400px]">
			<div class="absolute top-0 right-0 w-1 h-full bg-green-600/20"></div>
			
			<div class="p-4 border-b border-gray-700 bg-gray-800/50 flex flex-wrap gap-2 justify-between items-center z-10 sticky top-0">
				<h2 class="text-green-400 font-bold flex items-center gap-2">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
					RECEBER
				</h2>
				<div class="flex gap-2 items-center">
					<select id="rxFreqBase" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-green-500">
						<option value="1000">1.0 kHz</option>
						<option value="3000">3.0 kHz</option>
						<option value="5000">5.0 kHz</option>
						<option value="6000">6.0 kHz</option>
						<option value="9000">9.0 kHz</option>
						<option value="12000">12.0 kHz</option>
						<option value="15000">15.0 kHz</option>
					</select>
					<button id="btnListen" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-2 rounded-lg font-bold transition whitespace-nowrap touch-manipulation">
						LIGAR MIC
					</button>
				</div>
			</div>
			
			<!-- Terminal de Saída -->
			<div class="flex-grow p-4 flex flex-col relative overflow-hidden">
				<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiMzMzMiLz48L3N2Zz4=')] opacity-20 pointer-events-none"></div>
				<div class="relative z-10 flex flex-col h-full gap-4">
					<div class="flex justify-between items-center">
						<label class="text-xs text-green-700 font-bold uppercase">Chat Recebido</label>
						<span id="rxStateIndicator" class="text-xs text-gray-500 font-mono">OFFLINE</span>
					</div>
					<div id="rxTerminal" class="flex-grow bg-gray-900/80 border border-green-900/50 rounded-lg p-4 font-mono text-xl text-green-400 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] overflow-y-auto whitespace-pre-wrap break-words leading-relaxed min-h-[200px]">
						<span class="animate-pulse text-green-700">_</span>
					</div>
					<!-- Debug Visual Compacto -->
					<div class="h-20 bg-gray-900 rounded border border-gray-700 relative overflow-hidden flex items-end shrink-0">
						<canvas id="spectrumCanvas" class="w-full h-full opacity-60"></canvas>
						<div class="absolute top-2 right-2 text-[10px] text-gray-500 font-mono bg-black/50 px-2 rounded">
							SINAL: <span id="debugLevel" class="text-white">0</span>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>
	<script>
		// --- CONFIGURAÇÃO ---
		const SHIFT = 400; // Bit 1 = Base + 400Hz
		// --- TRANSMISSOR (TX) ---
		const TX = {
			ctx: null,
			isSending: false,
			init: () => {
				if (!TX.ctx) TX.ctx = new (window.AudioContext || window.webkitAudioContext)();
			},
			playTone: (freq, startTime, duration) => {
				const osc = TX.ctx.createOscillator();
				const gain = TX.ctx.createGain();
				osc.type = 'sine';
				osc.frequency.value = freq;
				osc.connect(gain);
				gain.connect(TX.ctx.destination);
				// Envelope suave
				gain.gain.setValueAtTime(0, startTime);
				gain.gain.linearRampToValueAtTime(1, startTime + 0.01);
				gain.gain.setValueAtTime(1, startTime + duration - 0.01);
				gain.gain.linearRampToValueAtTime(0, startTime + duration);
				osc.start(startTime);
				osc.stop(startTime + duration + 0.05);
			},
			send: async (text) => {
				TX.init();
				if (TX.ctx.state === 'suspended') await TX.ctx.resume();
				if (TX.isSending) return;
				TX.isSending = true;
				// Capturar configurações do momento do clique
				const txBaseFreq = parseInt(document.getElementById('txFreqBase').value);
				const bitLen = parseInt(document.getElementById('txSpeed').value);
				const bitSec = bitLen / 1000;
				const btn = document.getElementById('btnSend');
				const originalText = btn.innerHTML;
				btn.innerHTML = `<span class="animate-spin">↻</span> ENVIANDO...`;
				btn.classList.add('bg-red-600', 'cursor-not-allowed');
				// Limpar visualizador TX
				const vis = document.getElementById('txVisualizer');
				vis.innerHTML = '';
				// Agendar áudio
				let now = TX.ctx.currentTime + 0.5;
				// Funções locais de frequência baseadas na escolha do TX
				const getFreq1 = () => txBaseFreq + SHIFT;
				const getFreq0 = () => txBaseFreq;
				for (let i = 0; i < text.length; i++) {
					const charCode = text.charCodeAt(i);
					// Start Bit (Sempre 1)
					TX.playTone(getFreq1(), now, bitSec);
					TX.addVis(1, "START");
					now += bitSec;
					// 8 Bits de Dados
					for (let b = 0; b < 8; b++) {
						const bit = (charCode >> (7 - b)) & 1;
						const freq = bit === 1 ? getFreq1() : getFreq0();
						TX.playTone(freq, now, bitSec);
						TX.addVis(bit, bit);
						now += bitSec;
					}
					// Gap
					now += (bitSec * 2);
					TX.addVis('gap', 'GAP');
				}
				const totalTime = (now - TX.ctx.currentTime) * 1000;
				setTimeout(() => {
					TX.isSending = false;
					btn.innerHTML = originalText;
					btn.classList.remove('bg-red-600', 'cursor-not-allowed');
				}, totalTime);
			},
			addVis: (type, label) => {
				const vis = document.getElementById('txVisualizer');
				const el = document.createElement('div');
				el.className = `w-4 h-6 flex items-center justify-center text-[8px] rounded shrink-0 mb-1 ${
				type === 1 ? 'bg-green-600 text-white' : 
				type === 0 ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-600 w-2'
				}`;
				if(type !== 'gap') el.innerText = label === "START" ? "S" : label;
				vis.appendChild(el);
				vis.scrollTop = vis.scrollHeight;
			}
		};
		// --- RECEPTOR (RX) ---
		const RX = {
			ctx: null,
			analyser: null,
			buffer: new Uint8Array(0),
			isActive: false,
			state: 'IDLE',
			bits: [],
			syncTime: 0,
			armed: false,
			threshold: 40,
			start: async () => {
				try {
					RX.ctx = new (window.AudioContext || window.webkitAudioContext)();
					RX.analyser = RX.ctx.createAnalyser();
					RX.analyser.fftSize = 1024;
					RX.analyser.smoothingTimeConstant = 0.2;
					const stream = await navigator.mediaDevices.getUserMedia({ 
						audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } 
					});
					const source = RX.ctx.createMediaStreamSource(stream);
					source.connect(RX.analyser);
					RX.isActive = true;
					RX.buffer = new Uint8Array(RX.analyser.frequencyBinCount);
					document.getElementById('btnListen').innerText = "OUVINDO...";
					document.getElementById('btnListen').classList.replace('bg-green-600', 'bg-red-500');
					document.getElementById('rxStateIndicator').innerText = "AGUARDANDO SINAL...";
					document.getElementById('rxStateIndicator').classList.add('animate-pulse');
					RX.loop();
				} catch (err) {
					alert("Erro Mic: " + err);
				}
			},
			getBinEnergy: (targetFreq) => {
				const nyquist = RX.ctx.sampleRate / 2;
				const index = Math.round((targetFreq / nyquist) * RX.analyser.frequencyBinCount);
				let sum = 0;
				for(let i = -1; i <= 1; i++) sum += RX.buffer[index + i] || 0;
				return sum / 3;
			},
			loop: () => {
				if (!RX.isActive) return;
				requestAnimationFrame(RX.loop);
				RX.analyser.getByteFrequencyData(RX.buffer);
				// Config dinâmica baseada no seletor RX
				const rxBaseFreq = parseInt(document.getElementById('rxFreqBase').value);
				const freq0 = rxBaseFreq;
				const freq1 = rxBaseFreq + SHIFT;
				// Desenhar
				RX.drawDebug(freq0, freq1);
				const energy0 = RX.getBinEnergy(freq0);
				const energy1 = RX.getBinEnergy(freq1);
				const maxEnergy = Math.max(energy0, energy1);
				const bitLen = 100; // Rx assume velocidade lenta padrão para sincronia mais fácil, idealmente deveria auto-detectar ou ter config
				const now = performance.now();
				// Máquina de Estados RX
				if (RX.state === 'IDLE') {
					if (maxEnergy < RX.threshold) RX.armed = true;
					if (RX.armed && energy1 > RX.threshold && energy1 > energy0 + 20) {
						RX.state = 'READING';
						RX.syncTime = now;
						RX.bits = [];
						RX.armed = false;
						
						document.getElementById('rxStateIndicator').innerText = "RECEBENDO...";
						document.getElementById('rxStateIndicator').className = "text-green-400 font-bold";
					}
				}
				else if (RX.state === 'READING') {
					// Usamos a velocidade do TX selecionada no RX? 
					// Para simplificar, assumimos que o usuário configura TX lento -> RX lento.
					// Mas aqui vamos fixar em 100ms (Lento) que é o mais seguro.
					// Se o user transmitir rápido, precisaria de um seletor de velocidade no RX também.
					// Para o demo, vamos assumir que o TX Speed 'Lento' é o padrão compatível.
					// *Se quiser suportar Rápido no RX, adicione um seletor de Baud Rate no RX também.*
					
					// Pegando bitlen do transmissor (hack visual) ou fixo. Vamos tentar inferir do TX visualmente se tiver na mesma tela?
					// Não, vamos usar a configuração "Lento" (100ms) hardcoded no RX para robustez, 
					// ou adicionar seletor. Vou usar o valor do seletor TX se disponível, senão 100.
					let currentBitLen = parseInt(document.getElementById('txSpeed').value) || 100;
					const bitsLidos = RX.bits.length;
					const sampleTime = RX.syncTime + (currentBitLen * (1 + bitsLidos)) + (currentBitLen * 0.5);
					if (now >= sampleTime) {
						let bit = 0;
						if (maxEnergy >= RX.threshold) {
							bit = energy1 > energy0 ? 1 : 0;
						}
						RX.bits.push(bit);
						if (RX.bits.length === 8) {
							RX.processChar();
							RX.state = 'COOLDOWN';
							RX.cooldownEnd = now + currentBitLen; 
						}
					}
				}
				else if (RX.state === 'COOLDOWN') {
					if (now > RX.cooldownEnd) {
						RX.state = 'IDLE';
						document.getElementById('rxStateIndicator').innerText = "AGUARDANDO...";
						document.getElementById('rxStateIndicator').className = "text-gray-500 animate-pulse";
					}
				}
			},
			processChar: () => {
				let charCode = 0;
				RX.bits.forEach(bit => { charCode = (charCode << 1) | bit; });
				if ((charCode >= 32 && charCode <= 126) || charCode === 10 || charCode === 13) {
					const char = String.fromCharCode(charCode);
					const term = document.getElementById('rxTerminal');
					let currentText = term.innerText;
					if (currentText.endsWith('_')) currentText = currentText.slice(0, -1);
					term.innerText = currentText + char + "_";
					term.scrollTop = term.scrollHeight;
					term.classList.remove('char-received');
					void term.offsetWidth;
					term.classList.add('char-received');
				}
			},
			drawDebug: (f0, f1) => {
				const cvs = document.getElementById('spectrumCanvas');
				const ctx = cvs.getContext('2d');
				const w = cvs.width;
				const h = cvs.height;
				ctx.fillStyle = 'rgba(0,0,0,0.2)';
				ctx.fillRect(0, 0, w, h);
				const barW = (w / RX.buffer.length) * 2;
				let x = 0;
				for(let i=0; i<RX.buffer.length; i++) {
					const v = RX.buffer[i];
					ctx.fillStyle = `rgb(0, ${v}, 0)`;
					ctx.fillRect(x, h - (v/2), barW, v/2);
					x += barW;
				}
				const e0 = RX.getBinEnergy(f0);
				const e1 = RX.getBinEnergy(f1);
				document.getElementById('debugLevel').innerText = `L:${e0.toFixed(0)} / H:${e1.toFixed(0)}`;
			}
		};
		// --- BINDINGS ---
		window.onload = () => {
			document.getElementById('btnSend').onclick = () => {
				const txt = document.getElementById('txInput').value;
				if(txt) TX.send(txt);
			};
			
			document.getElementById('btnListen').onclick = RX.start;
			
			const cvs = document.getElementById('spectrumCanvas');
			cvs.width = cvs.offsetWidth;
			cvs.height = cvs.offsetHeight;
		};
	</script>
</body>
</html>
