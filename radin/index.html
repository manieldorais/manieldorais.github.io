<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radin de Som</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="style.css">
</head>
<!-- Ajuste 100% Mobile: Removemos travas de rolagem do desktop -->
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col overflow-y-auto">
	
	<!-- Topo -->
	<header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md z-10 shrink-0 sticky top-0">
		<div class="flex items-center gap-3">
			<div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>
			<h1 class="font-bold text-lg tracking-wider text-green-400">RADIN DE <span class="text-white">SOM</span></h1>
		</div>
		<div class="flex gap-4 text-xs font-bold text-gray-400 hidden sm:flex">
			<div class="flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-full"></span> 0 = LOW</div>
			<div class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full"></span> 1 = HIGH</div>
		</div>
	</header>
	
	<!-- Layout alterado para coluna única (flex-col) sempre -->
	<main class="flex-grow flex flex-col h-full max-w-lg mx-auto w-full">
		
		<!-- SEÇÃO TRANSMISSOR -->
		<section class="border-b border-gray-700 flex flex-col relative bg-gray-900/50">
			<div class="absolute top-0 left-0 w-1 h-full bg-blue-600/20"></div>
			
			<!-- Header do TX com Controles -->
			<div class="p-4 border-b border-gray-700 bg-gray-800/50 flex flex-wrap gap-2 justify-between items-center">
				<h2 class="text-blue-400 font-bold flex items-center gap-2">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
					ENVIAR
				</h2>
				
				<div class="flex gap-2 flex-wrap justify-end">
					<select id="txFreqBase" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-blue-500">
						<option value="1000">1.0 kHz (Teste)</option>
						<option value="3000">3.0 kHz (Estável)</option>
						<option value="5000">5.0 kHz</option>
						<option value="6000">6.0 kHz</option>
						<option value="9000">9.0 kHz (Alta Fid.)</option>
						<option value="12000">12.0 kHz</option>
						<option value="15000">15.0 kHz</option>
						<option value="19000">19.0 kHz (Ultrassom)</option>
					</select>
					
					<select id="txSpeed" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-blue-500">
						<option value="100">100ms (Lento)</option>
						<option value="60">60ms (Rápido)</option>
						<option value="30">30ms (Turbo 19kHz)</option>
					</select>
				</div>
			</div>
			
			<div class="p-4 flex flex-col gap-4">
				<div>
					<label class="text-xs text-gray-400 font-bold mb-2 block uppercase">Mensagem</label>
					<textarea id="txInput" rows="2" class="w-full bg-gray-800 border-2 border-gray-700 rounded p-3 text-white focus:border-blue-500 outline-none transition resize-none text-lg placeholder-gray-600" placeholder="Digite para enviar..."></textarea>
				</div>
				
				<button id="btnSend" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-900/40 transition active:scale-95 flex justify-center items-center gap-2 touch-manipulation">
					<span>TRANSMITIR</span>
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
				</button>
				
				<!-- Status Visual TX -->
				<div class="bg-black rounded p-2 font-mono text-xs border border-gray-700 h-24 overflow-hidden relative">
					<div class="text-gray-500 border-b border-gray-800 mb-1 pb-1 flex justify-between">
						<span>TX MONITOR</span>
						<span id="txStatus" class="text-gray-400">IDLE</span>
					</div>
					<div id="txVisualizer" class="flex flex-wrap gap-1 opacity-80 pb-2"></div>
				</div>
			</div>
		</section>
		
		<!-- SEÇÃO RECEPTOR -->
		<section class="flex-grow flex flex-col relative bg-black min-h-[400px]">
			<div class="absolute top-0 right-0 w-1 h-full bg-green-600/20"></div>
			
			<div class="p-4 border-b border-gray-700 bg-gray-800/50 flex flex-wrap gap-2 justify-between items-center z-10 sticky top-0">
				<h2 class="text-green-400 font-bold flex items-center gap-2">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
					RECEBER
				</h2>
				<div class="flex gap-2 items-center flex-wrap justify-end">
					<!-- ADDED: Seletor de Velocidade no RX -->
					<select id="rxSpeed" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-green-500">
						<option value="100">100ms</option>
						<option value="60">60ms</option>
						<option value="30">30ms (Turbo)</option>
					</select>
					
					<select id="rxFreqBase" class="bg-gray-900 text-xs border border-gray-600 rounded px-2 py-1 outline-none text-gray-300 focus:border-green-500">
						<option value="1000">1.0 kHz</option>
						<option value="3000">3.0 kHz</option>
						<option value="5000">5.0 kHz</option>
						<option value="6000">6.0 kHz</option>
						<option value="9000">9.0 kHz</option>
						<option value="12000">12.0 kHz</option>
						<option value="15000">15.0 kHz</option>
						<option value="19000">19.0 kHz</option>
					</select>
					<button id="btnListen" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-2 rounded-lg font-bold transition whitespace-nowrap touch-manipulation">
						LIGAR MIC
					</button>
				</div>
			</div>
			
			<!-- Terminal de Saída -->
			<div class="flex-grow p-4 flex flex-col relative overflow-hidden">
				<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiMzMzMiLz48L3N2Zz4=')] opacity-20 pointer-events-none"></div>
				<div class="relative z-10 flex flex-col h-full gap-4">
					<div class="flex justify-between items-center">
						<label class="text-xs text-green-700 font-bold uppercase">Chat Recebido</label>
						<span id="rxStateIndicator" class="text-xs text-gray-500 font-mono">OFFLINE</span>
					</div>
					<div id="rxTerminal" class="flex-grow bg-gray-900/80 border border-green-900/50 rounded-lg p-4 font-mono text-xl text-green-400 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] overflow-y-auto whitespace-pre-wrap break-words leading-relaxed min-h-[200px]">
						<span class="animate-pulse text-green-700">_</span>
					</div>
					<!-- Debug Visual Compacto -->
					<div class="h-20 bg-gray-900 rounded border border-gray-700 relative overflow-hidden flex items-end shrink-0">
						<canvas id="spectrumCanvas" class="w-full h-full opacity-60"></canvas>
						<div class="absolute top-2 right-2 text-[10px] text-gray-500 font-mono bg-black/50 px-2 rounded">
							SINAL: <span id="debugLevel" class="text-white">0</span>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>
	<script src="script.js"></script>
</body>
</html>
