<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin - Gerenciar Artigos</title>
	
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="css/admin.css">

	<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
</head>
<body>

	<div id="login-screen">
		<div class="login-box">
			<h2 style="margin-bottom: 1rem; text-align: center;">Admin Login</h2>
			
			<div class="form-group">
				<label>Email</label>
				<input type="email" id="email-input" placeholder="admin@email.com">
			</div>
			
			<div class="form-group">
				<label>Senha</label>
				<input type="password" id="password-input" placeholder="********">
			</div>
			
			<button class="btn btn-primary" id="btn-login" style="width: 100%">Entrar</button>
			<p id="login-error" style="color: red; margin-top: 10px; display: none; text-align: center; font-size: 0.9rem;"></p>
		</div>
	</div>

	<div id="admin-panel" class="container">
		
		<div class="header-panel">
			<h1>Gerenciador</h1>
			<div style="display: flex; gap: 1rem;">
				<button id="btn-novo" class="btn btn-primary">+ Novo Artigo</button>
				<button id="btn-logout" class="btn btn-danger">Sair</button>
			</div>
		</div>

		<div id="list-section" class="table-container">
			<table>
				<thead>
					<tr>
						<th>Data</th>
						<th>Título</th>
						<th>Tag</th>
						<th style="text-align: right;">Ações</th>
					</tr>
				</thead>
				<tbody id="posts-table-body">
					</tbody>
			</table>
			<p id="loading-msg" style="padding: 2rem; text-align: center; color: #6b7280;">Carregando...</p>
		</div>

		<div id="form-section">
			<h2 id="form-title" style="margin-bottom: 1.5rem;">Novo Artigo</h2>
			
			<form id="post-form">
				<input type="hidden" id="edit-id">

				<div class="form-group">
					<label>Título</label>
					<input type="text" id="titulo" required>
				</div>

				<div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
					<div>
						<label>Tag</label>
						<input type="text" id="tag">
					</div>
					<div>
						<label>Data</label>
						<input type="date" id="data" required>
					</div>
				</div>

				<div class="form-group">
					<label>URL da Imagem</label>
					<input type="url" id="imagem" required>
				</div>

				<div class="form-group">
					<label>Resumo</label>
					<textarea id="resumo" rows="2" required></textarea>
				</div>

				<div class="form-group">
					<label>Conteúdo</label>
					<textarea id="conteudo"></textarea> </div>

				<div style="display: flex; justify-content: flex-end; gap: 1rem;">
					<button type="button" id="btn-cancelar" class="btn btn-cancel">Cancelar</button>
					<button type="submit" class="btn btn-primary" id="btn-save">Publicar Artigo</button>
				</div>
			</form>
		</div>

	</div>

	<script type="module" src="js/admin.js"></script>
</body>
</html>
