<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Blog do Daniel</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<header>
		<div class="container">
			<a href="index.html" class="logo">Daniel's Blog</a>
		</div>
	</header>

	<main class="container">
		<a href="index.html" class="back-link">&larr; Voltar para Home</a>

		<article id="article-container">
			<p style="text-align: center;">Carregando artigo...</p>
		</article>

		<section id="comments-section" class="container-read">
	<h2 style="margin-top: 4rem;">💬 Comentários</h2>
	
	<div id="comment-list" style="margin-bottom: 2rem;">
		</div>
	
	<h3 style="margin-top: 2rem; border-top: 1px solid #ddd; padding-top: 2rem;">Deixe seu Comentário</h3>
	
	<form id="comment-form" class="contact-form" style="background: none; box-shadow: none; padding: 0;">
		<div class="form-group">
			<label for="nome">Nome</label>
			<input type="text" id="nome" name="nome" class="form-control" required>
		</div>
		
		<div class="form-group">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" class="form-control" required>
		</div>
		
		<div class="form-group">
			<label for="comentario">Comentário</label>
			<textarea id="comentario" name="comentario" class="form-control" rows="4" required></textarea>
		</div>
		
		<button type="submit" id="btn-comentar" class="btn-submit">Enviar Comentário</button>
	</form>
</section>
	</main>

	<footer>
		<p>&copy; 2025 Daniel. Blog Pessoal.</p>
	</footer>

	<script type="module" src="js/read.js"></script>
</body>
</html>
